<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sotuvchi-konsultant Anketasi</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    *{
      box-sizing: border-box;
    }
    
    body{
      background:#f5f6f8;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      margin:0;
    }
    
    .container{
      background:white;
      max-width:900px;
      margin:0 auto;
      padding:24px;
    }
    
    h2{
      text-align:center;
      margin-bottom:10px;
      font-size:20px;
    }
    
    h3{
      font-size:15px;
      margin-bottom:12px;
      font-weight:600;
      color:#333;
    }
    
    .section{
      margin-top:25px;
      padding-top:15px;
      border-top:1px solid #eee;
    }
    
    input, textarea{
      width:100%;
      padding:14px;
      margin-bottom:12px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px; /* zoom oldini oladi */
      background:#fafafa;
      transition:0.2s;
    }
    
    input:focus, textarea:focus{
      outline:none;
      border-color:black;
      background:white;
    }
    
    textarea{
      min-height:90px;
      resize:vertical;
    }
    
    #preview{
      width:120px;
      display:block;
      margin:15px auto;
      border-radius:12px;
    }
    
    button{
      width:100%;
      padding:16px;
      background:black;
      color:white;
      border:none;
      border-radius:12px;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      margin-top:20px;
    }
    
    button:active{
      transform:scale(0.98);
    }
    
    /* MOBILE OPTIMIZATION */
    @media (max-width:600px){
    
      .container{
        padding:18px;
      }
    
      h2{
        font-size:18px;
      }
    
      input, textarea{
        padding:16px;
      }
    
      button{
        position:sticky;
        bottom:0;
      }
    
    }

    label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:5px;
  margin-top:10px;
  color:#333;
}

.progress-wrapper{
  width:100%;
  height:8px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:black;
  transition:0.3s ease;
}

button{
  position:relative;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.spinner{
  border:3px solid #fff;
  border-top:3px solid transparent;
  border-radius:50%;
  width:18px;
  height:18px;
  animation:spin 0.7s linear infinite;
  margin:0 auto;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}


    </style>
    
</head>

<body>
<div class="container">
<h2>SOTUVCHI-KONSULTANT ANKETASI</h2>

<form id="jobForm">
    <label for="photo" style="font-weight:600; display:block; margin-bottom:6px;">
        Rasmingizni yuklang (3x4 yoki aniq yuz ko‘rinadigan)
      </label>
<input type="file" id="photo" name="photo" accept="image/*" required>
<img id="preview" style="width:120px;margin:10px auto;display:block;border-radius:8px;" />

<!-- FORM CONTENT O'ZGARMAGAN -->
<div class="section">
    <h3>UMUMIY MA’LUMOTLAR</h3>

    <input name="fullname" placeholder="F.I.Sh" required>
    <label>Tug‘ilgan sana</label>
    <input type="date" name="birthdate" required>
    <input name="age" placeholder="Yoshi">
    <input name="citizenship" placeholder="Fuqaroligi">
    <input name="nation" placeholder="Millati">
    <input name="passport" placeholder="Pasport ma’lumotlari">
    <input name="passport_info" placeholder="Berilgan sana va joy">
    <input name="address_permanent" placeholder="Doimiy manzil">
    <input name="address_current" placeholder="Amaldagi manzil">
    <input name="phone" placeholder="Telefon raqami" required>
    <input name="extra_contact" placeholder="Qo‘shimcha aloqa">
    <input name="telegram" placeholder="Telegram / messenjer">
    </div>
    
    <div class="section">
    <h3>TA'LIM</h3>
    <input name="education_level" placeholder="Ma’lumoti">
    <input name="education_place" placeholder="Ta’lim muassasasi">
    <input name="speciality" placeholder="Mutaxassisligi">
    <input name="graduation_year" placeholder="Bitirgan yili">
    </div>
    
    <div class="section">
    <h3>OILAVIY HOLATI</h3>
    <input name="marital_status" placeholder="Oilaviy holati">
    <input name="children" placeholder="Farzandlari soni">
    </div>
    
    <div class="section">
    <h3>SOG‘LIG‘I</h3>
    <textarea name="health"></textarea>
    </div>
    
    <div class="section">
    <h3>ISH TAJRIBASI 1</h3>
    <input name="company1" placeholder="Kompaniya nomi">
    <input name="position1" placeholder="Lavozimi">
    <input name="period1" placeholder="Ishlagan muddati">
    <textarea name="tasks1" placeholder="Asosiy vazifalari"></textarea>
    <input name="reason1" placeholder="Ketish sababi">
    </div>
    
    <div class="section">
    <h3>ISH TAJRIBASI 2</h3>
    <input name="company2" placeholder="Kompaniya nomi">
    <input name="position2" placeholder="Lavozimi">
    <input name="period2" placeholder="Ishlagan muddati">
    <textarea name="tasks2" placeholder="Asosiy vazifalari"></textarea>
    <input name="reason2" placeholder="Ketish sababi">
    </div>
    
    <div class="section">
    <h3>KO‘NIKMALAR</h3>
    <textarea name="skills"></textarea>
    <textarea name="crm"></textarea>
    </div>
    
    <div class="section">
    <h3>ISH GRAFIKI</h3>
    <input name="schedule">
    </div>
    
    <div class="section">
    <h3>QO‘SHIMCHA</h3>
    <textarea name="recommendations"></textarea>
    <textarea name="expectations"></textarea>
    </div>
<!-- (sening barcha sectionlaring shu yerda qoladi, o'zgarmaydi) -->

<button type="submit" id="submitBtn">
    <span id="btnText">Yuborish</span>
  </button>
  

<div class="progress-wrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <p id="progressText" style="text-align:center;font-size:14px;margin-top:8px;">
    0% to‘ldirildi
  </p>
  

</form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function(){
    
    const form = document.getElementById("jobForm");
    const preview = document.getElementById("preview");
    const photoInput = document.getElementById("photo");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    
    const inputs = form.querySelectorAll("input, textarea");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    
    /* ================= PHOTO PREVIEW ================= */
    
    photoInput.addEventListener("change", function(){
      const file = this.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = e => preview.src = e.target.result;
        reader.readAsDataURL(file);
      }
    });
    
    /* ================= AUTO SAVE ================= */
    
    window.addEventListener("load", () => {
      inputs.forEach(input => {
        const saved = localStorage.getItem(input.name);
        if(saved){
          input.value = saved;
        }
      });
      updateProgress();
    });
    
    inputs.forEach(input => {
      input.addEventListener("input", () => {
        localStorage.setItem(input.name, input.value);
        updateProgress();
      });
    });
    
    /* ================= PROGRESS ================= */
    
    function updateProgress(){
      let filled = 0;
      inputs.forEach(input => {
        if(input.value.trim() !== ""){
          filled++;
        }
      });
    
      const percent = Math.round((filled / inputs.length) * 100);
    
      if(progressBar) progressBar.style.width = percent + "%";
      if(progressText) progressText.innerText = percent + "% to‘ldirildi";
    }
    
    /* ================= SUBMIT ================= */
    
    form.addEventListener("submit", async function(e){
      e.preventDefault();
    
      submitBtn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div>';
    
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const data = new FormData(form);
      const get = n => data.get(n) || "-";
    
      let y = 20;
    
      /* ===== HEADER ===== */
      doc.setFillColor(0,0,0);
      doc.rect(0,0,210,20,"F");
    
      doc.setTextColor(255,255,255);
      doc.setFontSize(14);
      doc.text("FELIZA HR ANKETA",105,13,{align:"center"});
    
      doc.setTextColor(0,0,0);
      y = 30;
    
      /* ===== FULL NAME ===== */
      doc.setFontSize(18);
      doc.setFont(undefined,"bold");
      doc.text(get("fullname"),20,y);
      doc.setFont(undefined,"normal");
      y += 10;
    
      /* ===== IMAGE ===== */
      if(preview.src){
        const format = preview.src.includes("png") ? "PNG" : "JPEG";
        doc.addImage(preview.src, format,150,30,40,40);
      }
    
      function section(title){
        y += 8;
        if(y > 260){ doc.addPage(); y = 20; }
        doc.setDrawColor(0);
        doc.line(20,y,190,y);
        y += 8;
        doc.setFont(undefined,"bold");
        doc.setFontSize(13);
        doc.text(title,20,y);
        doc.setFont(undefined,"normal");
        y += 8;
      }
    
      function field(label,value){
        if(y > 270){ doc.addPage(); y = 20; }
        doc.setFontSize(11);
        doc.text(label + ":",20,y);
        doc.text(String(value),80,y);
        y += 7;
      }
    
      section("SHAXSIY MA'LUMOTLAR");
      field("Tug'ilgan sana",get("birthdate"));
      field("Yoshi",get("age"));
      field("Fuqaroligi",get("citizenship"));
      field("Millati",get("nation"));
      field("Telefon",get("phone"));
      field("Telegram",get("telegram"));
      field("Doimiy manzil",get("address_permanent"));
      field("Hozirgi manzil",get("address_current"));
    
      section("TA'LIM");
      field("Ma'lumoti",get("education_level"));
      field("Muassasa",get("education_place"));
      field("Mutaxassisligi",get("speciality"));
      field("Bitirgan yili",get("graduation_year"));
    
      section("OILAVIY HOLATI");
      field("Holati",get("marital_status"));
      field("Farzandlari",get("children"));
    
      section("SOG'LIG'I");
      field("Ma'lumot",get("health"));
    
      section("ISH TAJRIBASI 1");
      field("Kompaniya",get("company1"));
      field("Lavozim",get("position1"));
      field("Muddati",get("period1"));
      field("Vazifalari",get("tasks1"));
      field("Ketish sababi",get("reason1"));
    
      section("ISH TAJRIBASI 2");
      field("Kompaniya",get("company2"));
      field("Lavozim",get("position2"));
      field("Muddati",get("period2"));
      field("Vazifalari",get("tasks2"));
      field("Ketish sababi",get("reason2"));
    
      section("KO'NIKMALAR");
      field("Savdo ko'nikmalari",get("skills"));
      field("CRM",get("crm"));
    
      section("QO'SHIMCHA");
      field("Tavsiyalar",get("recommendations"));
      field("Kutayotganlari",get("expectations"));

      /* ===== FOOTER ===== */
    
      const nodemailer = require("nodemailer");
const fetch = require("node-fetch");

exports.handler = async (event) => {
  try {
    const { pdfBase64, fullname } = JSON.parse(event.body);

    /* ================= EMAIL ================= */

    const transporter = nodemailer.createTransport({
      service: "gmail",
      auth: {
        user: process.env.EMAIL_USER,
        pass: process.env.EMAIL_PASS
      }
    });

    await transporter.sendMail({
      from: process.env.EMAIL_USER,
      to: process.env.EMAIL_USER,
      subject: `Yangi HR Anketa - ${fullname}`,
      text: "Yangi anketa biriktirilgan.",
      attachments: [
        {
          filename: "feliza-anketa.pdf",
          content: pdfBase64,
          encoding: "base64"
        }
      ]
    });

    /* ================= TELEGRAM ================= */

    const telegramUrl = `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendDocument`;

    await fetch(telegramUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        chat_id: process.env.TELEGRAM_CHAT_ID,
        document: pdfBase64,
        caption: `📄 Yangi HR Anketa\n\n👤 Ism: ${fullname}`
      })
    });

    return {
      statusCode: 200,
      body: JSON.stringify({ message: "Email & Telegram sent" })
    };

  } catch (error) {
    return {
      statusCode: 500,
      body: JSON.stringify({ error: error.message })
    };
  }
};


      /* ===== FOOTER ===== */
      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text(
        "Yaratilgan sana: " + new Date().toLocaleDateString(),
        105,
        290,
        {align:"center"}
      );
    
      try{
    
        const pdfBase64 = doc.output("datauristring").split(',')[1];
    
        await fetch("/.netlify/functions/sendemail",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            pdfBase64:pdfBase64,
            fullname:get("fullname")
          })
        });
    
        btnText.innerText = "Yuborildi ✅";
        localStorage.clear();
    
        setTimeout(()=>{
          doc.save("feliza-anketa.pdf");
        },800);
    
      }catch(err){
        submitBtn.disabled = false;
        btnText.innerText = "Qayta urinib ko‘ring ❌";
        console.error(err);
      }
    
    });
    
    });
    </script>
        
</body>
</html>
