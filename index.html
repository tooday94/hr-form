<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Sotuvchi-konsultant Anketasi</title>

<!-- jsPDF (TO‘G‘RI VERSIYA) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.min.js"></script>

<style>
body{
  background:#f4f4f4;
  font-family:Arial;
  padding:40px 0;
  margin:0;
}
.container{
  background:white;
  max-width:900px;
  margin:0 auto;
  padding:40px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
h2,h3{ margin-top:30px; }
input,textarea{
  width:100%;
  padding:8px;
  margin:6px 0;
}
textarea{ height:70px; }
button{
  margin-top:20px;
  padding:14px;
  width:100%;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
  font-size:16px;
}
.section{
  border-top:1px solid #ddd;
  padding-top:20px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
<h2>SOTUVCHI-KONSULTANT ANKETASI</h2>

<form id="jobForm">

<input type="file" id="photo" accept="image/*" required>
<img id="preview" style="width:120px;margin:10px auto;display:block;border-radius:8px;" />

<input name="fullname" placeholder="F.I.Sh" required>
<input type="date" name="birthdate" required>
<input name="phone" placeholder="Telefon" required>

<button type="submit">Yuborish</button>

</form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const form = document.getElementById("jobForm");
const preview = document.getElementById("preview");
const photoInput = document.getElementById("photo");

photoInput.addEventListener("change", function(){
  const file = this.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = e => preview.src = e.target.result;
    reader.readAsDataURL(file);
  }
});

form.addEventListener("submit", async function(e){
  e.preventDefault();

  // 🔥 TO‘G‘RI JS PDF
  const doc = new jsPDF();

  const data = new FormData(form);
  const imageData = preview.src;

  let y = 20;

  doc.setFontSize(16);
  doc.text("SOTUVCHI-KONSULTANT ANKETASI", 20, y);
  y += 10;

  if (imageData) {
    doc.addImage(imageData, 'JPEG', 150, 20, 40, 40);
  }

  doc.setFontSize(11);

  for (let [key, value] of data.entries()) {
    if (key !== "photo") {
      doc.text(`${key}: ${value || "-"}`, 20, y);
      y += 7;
    }
  }

  doc.text(`Sana: ${new Date().toLocaleDateString()}`, 20, y + 5);

  // 🔥 EMAILGA YUBORISH
  const pdfBlob = doc.output("blob");
  const reader = new FileReader();

  reader.readAsDataURL(pdfBlob);

  reader.onloadend = async function () {
    const base64data = reader.result.split(',')[1];

    try {
      const response = await fetch("/.netlify/functions/sendemail", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pdfBase64: base64data,
          fullname: data.get("fullname")
        })
      });

      const result = await response.json();
      console.log("Email result:", result);

      alert("Anketa muvaffaqiyatli yuborildi ✅");
      doc.save("feliza-anketa.pdf");

    } catch (err) {
      console.error("Xato:", err);
      alert("Email yuborishda xatolik ❌");
    }
  };

});

});
</script>

</body>
</html>
