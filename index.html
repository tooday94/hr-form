<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Sotuvchi-konsultant Anketasi</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    *{
      box-sizing: border-box;
    }
    
    body{
      background:#f5f6f8;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      margin:0;
    }
    
    .container{
      background:white;
      max-width:900px;
      margin:0 auto;
      padding:24px;
    }
    
    h2{
      text-align:center;
      margin-bottom:10px;
      font-size:20px;
    }
    
    h3{
      font-size:15px;
      margin-bottom:12px;
      font-weight:600;
      color:#333;
    }
    
    .section{
      margin-top:25px;
      padding-top:15px;
      border-top:1px solid #eee;
    }
    
    input, textarea{
      width:100%;
      padding:14px;
      margin-bottom:12px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px; /* zoom oldini oladi */
      background:#fafafa;
      transition:0.2s;
    }
    
    input:focus, textarea:focus{
      outline:none;
      border-color:black;
      background:white;
    }
    
    textarea{
      min-height:90px;
      resize:vertical;
    }
    
    #preview{
      width:120px;
      display:block;
      margin:15px auto;
      border-radius:12px;
    }
    
    button{
      width:100%;
      padding:16px;
      background:black;
      color:white;
      border:none;
      border-radius:12px;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      margin-top:20px;
    }
    
    button:active{
      transform:scale(0.98);
    }
    
    /* MOBILE OPTIMIZATION */
    @media (max-width:600px){
    
      .container{
        padding:18px;
      }
    
      h2{
        font-size:18px;
      }
    
      input, textarea{
        padding:16px;
      }
    
      button{
        position:sticky;
        bottom:0;
      }
    
    }

    label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:5px;
  margin-top:10px;
  color:#333;
}

.progress-wrapper{
  width:100%;
  height:8px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:black;
  transition:0.3s ease;
}

button{
  position:relative;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.spinner{
  border:3px solid #fff;
  border-top:3px solid transparent;
  border-radius:50%;
  width:18px;
  height:18px;
  animation:spin 0.7s linear infinite;
  margin:0 auto;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}


    </style>
    
</head>

<body>
<div class="container">
<h2>SOTUVCHI-KONSULTANT ANKETASI</h2>

<form id="jobForm">

<input type="file" id="photo" name="photo" accept="image/*" required>
<img id="preview" style="width:120px;margin:10px auto;display:block;border-radius:8px;" />

<!-- FORM CONTENT O'ZGARMAGAN -->
<div class="section">
    <h3>UMUMIY MA’LUMOTLAR</h3>

    <input name="fullname" placeholder="F.I.Sh" required>
    <label>Tug‘ilgan sana</label>
    <input type="date" name="birthdate" required>
    <input name="age" placeholder="Yoshi">
    <input name="citizenship" placeholder="Fuqaroligi">
    <input name="nation" placeholder="Millati">
    <input name="passport" placeholder="Pasport ma’lumotlari">
    <input name="passport_info" placeholder="Berilgan sana va joy">
    <input name="address_permanent" placeholder="Doimiy manzil">
    <input name="address_current" placeholder="Amaldagi manzil">
    <input name="phone" placeholder="Telefon raqami" required>
    <input name="extra_contact" placeholder="Qo‘shimcha aloqa">
    <input name="telegram" placeholder="Telegram / messenjer">
    </div>
    
    <div class="section">
    <h3>TA'LIM</h3>
    <input name="education_level" placeholder="Ma’lumoti">
    <input name="education_place" placeholder="Ta’lim muassasasi">
    <input name="speciality" placeholder="Mutaxassisligi">
    <input name="graduation_year" placeholder="Bitirgan yili">
    </div>
    
    <div class="section">
    <h3>OILAVIY HOLATI</h3>
    <input name="marital_status" placeholder="Oilaviy holati">
    <input name="children" placeholder="Farzandlari soni">
    </div>
    
    <div class="section">
    <h3>SOG‘LIG‘I</h3>
    <textarea name="health"></textarea>
    </div>
    
    <div class="section">
    <h3>ISH TAJRIBASI 1</h3>
    <input name="company1" placeholder="Kompaniya nomi">
    <input name="position1" placeholder="Lavozimi">
    <input name="period1" placeholder="Ishlagan muddati">
    <textarea name="tasks1" placeholder="Asosiy vazifalari"></textarea>
    <input name="reason1" placeholder="Ketish sababi">
    </div>
    
    <div class="section">
    <h3>ISH TAJRIBASI 2</h3>
    <input name="company2" placeholder="Kompaniya nomi">
    <input name="position2" placeholder="Lavozimi">
    <input name="period2" placeholder="Ishlagan muddati">
    <textarea name="tasks2" placeholder="Asosiy vazifalari"></textarea>
    <input name="reason2" placeholder="Ketish sababi">
    </div>
    
    <div class="section">
    <h3>KO‘NIKMALAR</h3>
    <textarea name="skills"></textarea>
    <textarea name="crm"></textarea>
    </div>
    
    <div class="section">
    <h3>ISH GRAFIKI</h3>
    <input name="schedule">
    </div>
    
    <div class="section">
    <h3>QO‘SHIMCHA</h3>
    <textarea name="recommendations"></textarea>
    <textarea name="expectations"></textarea>
    </div>
<!-- (sening barcha sectionlaring shu yerda qoladi, o'zgarmaydi) -->

<button type="submit" id="submitBtn">
    <span id="btnText">Yuborish</span>
  </button>
  

<div class="progress-wrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <p id="progressText" style="text-align:center;font-size:14px;margin-top:8px;">
    0% to‘ldirildi
  </p>
  

</form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function(){
    
    const form = document.getElementById("jobForm");
    const preview = document.getElementById("preview");
    const photoInput = document.getElementById("photo");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    
    const inputs = form.querySelectorAll("input, textarea");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    
    /* ================= PHOTO PREVIEW ================= */
    
    photoInput.addEventListener("change", function(){
      const file = this.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = e => preview.src = e.target.result;
        reader.readAsDataURL(file);
      }
    });
    
    /* ================= AUTO SAVE ================= */
    
    window.addEventListener("load", () => {
      inputs.forEach(input => {
        const saved = localStorage.getItem(input.name);
        if(saved){
          input.value = saved;
        }
      });
      updateProgress();
    });
    
    inputs.forEach(input => {
      input.addEventListener("input", () => {
        localStorage.setItem(input.name, input.value);
        updateProgress();
      });
    });
    
    /* ================= PROGRESS ================= */
    
    function updateProgress(){
      let filled = 0;
    
      inputs.forEach(input => {
        if(input.value.trim() !== ""){
          filled++;
        }
      });
    
      const percent = Math.round((filled / inputs.length) * 100);
    
      if(progressBar){
        progressBar.style.width = percent + "%";
      }
    
      if(progressText){
        progressText.innerText = percent + "% to‘ldirildi";
      }
    }
    
    /* ================= SUBMIT ================= */
    
    form.addEventListener("submit", async function(e){
      e.preventDefault();
    
      // 🔥 Loading start
      submitBtn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div>';
    
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const data = new FormData(form);
    
      let y = 20;
    
      function addSection(title){
        if(y > 260){ doc.addPage(); y = 20; }
        doc.setFont(undefined,"bold");
        doc.text(title,20,y);
        y+=8;
        doc.setFont(undefined,"normal");
      }
    
      function addField(label,value){
        if(y > 270){ doc.addPage(); y = 20; }
        doc.text(label + ": " + (value || "-"),20,y);
        y+=7;
      }
    
      doc.setFontSize(16);
      doc.text("SOTUVCHI-KONSULTANT ANKETASI",20,y);
      y+=10;
    
      if(preview.src){
        const format = preview.src.includes("png") ? "PNG" : "JPEG";
        doc.addImage(preview.src, format,150,20,40,40);
      }
    
      doc.setFontSize(11);
      const get = n => data.get(n);
    
      addSection("UMUMIY MA'LUMOTLAR");
      addField("F.I.Sh",get("fullname"));
      addField("Tug'ilgan sana",get("birthdate"));
      addField("Yoshi",get("age"));
      addField("Fuqaroligi",get("citizenship"));
      addField("Millati",get("nation"));
      addField("Pasport",get("passport"));
      addField("Pasport info",get("passport_info"));
      addField("Doimiy manzil",get("address_permanent"));
      addField("Hozirgi manzil",get("address_current"));
      addField("Telefon",get("phone"));
      addField("Qo'shimcha aloqa",get("extra_contact"));
      addField("Telegram",get("telegram"));
    
      addSection("TA'LIM");
      addField("Ma'lumoti",get("education_level"));
      addField("Muassasa",get("education_place"));
      addField("Mutaxassisligi",get("speciality"));
      addField("Bitirgan yili",get("graduation_year"));
    
      addSection("OILAVIY HOLATI");
      addField("Holati",get("marital_status"));
      addField("Farzandlari",get("children"));
    
      addSection("SOG'LIG'I");
      addField("Ma'lumot",get("health"));
    
      addSection("ISH TAJRIBASI 1");
      addField("Kompaniya",get("company1"));
      addField("Lavozim",get("position1"));
      addField("Muddati",get("period1"));
      addField("Vazifalari",get("tasks1"));
      addField("Ketish sababi",get("reason1"));
    
      addSection("ISH TAJRIBASI 2");
      addField("Kompaniya",get("company2"));
      addField("Lavozim",get("position2"));
      addField("Muddati",get("period2"));
      addField("Vazifalari",get("tasks2"));
      addField("Ketish sababi",get("reason2"));
    
      addSection("KO'NIKMALAR");
      addField("Ko'nikmalar",get("skills"));
      addField("CRM",get("crm"));
    
      addSection("ISH GRAFIKI");
      addField("Grafik",get("schedule"));
    
      addSection("QO'SHIMCHA");
      addField("Tavsiyalar",get("recommendations"));
      addField("Kutayotganlari",get("expectations"));
    
      y+=5;
      doc.text("Sana: "+new Date().toLocaleDateString(),20,y);
    
      try{
    
        const pdfBase64 = doc.output("datauristring").split(',')[1];
    
        await fetch("/.netlify/functions/sendemail",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            pdfBase64:pdfBase64,
            fullname:get("fullname")
          })
        });
    
        btnText.innerText = "Yuborildi ✅";
        localStorage.clear();
    
        setTimeout(()=>{
          doc.save("feliza-anketa.pdf");
        },800);
    
      }catch(err){
        submitBtn.disabled = false;
        btnText.innerText = "Qayta urinib ko‘ring ❌";
        console.error(err);
      }
    
    });
    
    });
    </script>
    
</body>
</html>
